# ===================================================================
# APEX UNIVERSITY ERP - STUDENT MANAGEMENT SYSTEM CONFIGURATION
# ===================================================================
spring.application.name=student-management-system
server.port=${SERVER_PORT:8080}

# -------------------------------------------------------------------
# MySQL Database Configuration
# Automatically creates 'student_management_db' if it does not exist.
# Override credentials via DB_URL, DB_USERNAME, DB_PASSWORD env vars.
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Allow automatic fallback to local MySQL-compatible storage if MySQL server is offline
app.database.allow-fallback=${ALLOW_DB_FALLBACK:true}

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Thymeleaf Template Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.university.sms=INFO
logging.level.org.springframework.security=WARN


# -------------------------------------------------------------------
# Advanced Java modules (Java Lab Console)
# -------------------------------------------------------------------
app.audit-log=logs/audit-trail.log
app.archive-db=archive/sms_archive.db
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Smart Campus features
app.alert-scan-seconds=120
app.verify-secret=${VERIFY_SECRET:apex-erp-marksheet-seal-2026}
