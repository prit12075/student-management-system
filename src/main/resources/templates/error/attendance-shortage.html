<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Hall Ticket Withheld')}"></head>
<body>
<div class="erp-wrapper">
    <aside th:replace="~{fragments/layout :: studentSidebar('hallticket')}"></aside>
    <div class="erp-main">
        <header th:replace="~{fragments/layout :: topbar('Hall Ticket Withheld', 'AttendanceShortageException handled by GlobalExceptionHandler')}"></header>
        <main class="erp-content">
            <div class="erp-card border-danger">
                <div class="p-4">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="erp-stat-icon bg-danger bg-opacity-10 text-danger"><i class="bi bi-exclamation-octagon-fill"></i></div>
                        <div>
                            <div class="h5 fw-bold text-danger mb-0">Not eligible for the end-semester examination</div>
                            <div class="small text-muted font-monospace" th:text="${exception.errorCode}">SMS-ATT-075</div>
                        </div>
                    </div>
                    <p class="mb-3" th:text="${exception.message}">message</p>
                    <div class="row g-3">
                        <div class="col-md-4"><div class="erp-stat-card stat-danger"><div class="small text-muted text-uppercase fw-semibold">Your attendance</div><div class="h3 fw-bold text-danger" th:text="${exception.attendancePercentage} + '%'">60%</div></div></div>
                        <div class="col-md-4"><div class="erp-stat-card"><div class="small text-muted text-uppercase fw-semibold">Required</div><div class="h3 fw-bold">75%</div></div></div>
                        <div class="col-md-4"><div class="erp-stat-card stat-warning"><div class="small text-muted text-uppercase fw-semibold">Classes to attend</div><div class="h3 fw-bold" th:text="${exception.classesNeeded}">5</div></div></div>
                    </div>
                    <a th:href="@{/student/attendance}" class="btn btn-outline-primary btn-sm mt-4"><i class="bi bi-person-check-fill me-1"></i>View subject-wise attendance</a>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
